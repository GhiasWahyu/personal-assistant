name: Proactive Morning Briefing

on:
  schedule:
    # 00:00 UTC = 07:00 WIB (Setiap hari jam 7 pagi)
    - cron: '0 0 * * *'
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual di GitHub Actions

jobs:
  morning_briefing:
    name: Generate and Send Morning Briefing
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'telegram_bot/requirements.txt'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r telegram_bot/requirements.txt

      - name: 🚀 Run Morning Briefing
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python morning_briefing.py
